[package]
name = "jon-cli"
version = "0.1.3"
edition = "2021"
license = "MIT"
description = "Natural language interface for Joy and Jyn - CLI for the Joyint ecosystem"
repository = "https://github.com/joyint/jon"
homepage = "https://joyint.com"
readme = "README.md"

[[bin]]
name = "jon"
path = "src/main.rs"

[dependencies]
jon-core = { version = "0.1.3", path = "../jon-core" }
clap = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
