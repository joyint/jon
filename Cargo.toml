[workspace]
resolver = "2"
members = [
    "crates/jon-core",
    "crates/jon-cli",
    "crates/jon",
]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
serde_json = "1.0"
serde_yaml_ng = "0.10"
minijinja = "2.18"
joy-core = { version = "0.19", path = "../joy/crates/joy-core" }
