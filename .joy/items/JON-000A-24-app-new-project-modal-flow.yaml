description: 'A ''New'' button right of ''+ Add'' (web ProjectOverview, desktop StartScreen) opening a small plain modal built from the existing Dialog primitives, no custom look. Step 1: repository input. If the repo already has a .joy store, the same modal says so and offers Add instead of Cancel; Add continues exactly like the ''+ Add'' register flow. If not, the modal offers the tool selection from the provider catalog plus API key and monthly limit with the per-tool recommendation (no model dropdown), then the shell opens with a collapsed rail in a chat named ''Jon PDA'' where the PDA session runs. The desktop local-folder path uses the local agent instead of key entry. Mirror item in the app backlog (JAPP).'
