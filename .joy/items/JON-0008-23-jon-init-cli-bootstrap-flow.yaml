description: 'jon init in an existing repository, running entirely with the local agent. With a .joy store present: say so and offer to continue as a normal Joy project. Without one: local agent setup building on joy ai init (tool choice from the joy-core tool list, the tool signs itself in, no API key prompt, no model choice; the tool decides the default model), then joy-level init plus the PDA session in the terminal. Punctual e2e test: scripted run bootstraps a project from an empty repo.'
