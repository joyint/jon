description: 'New jon.proto service on the platform (planned as phase 3 in JP-002F-B1): inspect a repository URL for a .joy store, bootstrap a project without one (clone, init via jon-core, open the ''Jon PDA'' chat, run the PDA session server-side, attributed as the user via jon), and surface a per-tool monthly budget recommendation in the provider catalog (providers.toml, ListProviders). Registration of repos that already have .joy keeps using RegisterProject unchanged. Mirror item in the platform backlog (JP).'
