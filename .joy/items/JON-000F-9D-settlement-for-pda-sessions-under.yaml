description: A tier 2 PDA session under Joyint Pro burns real tokens, booked as the user via jon, outside any member budget, so Jon's consumption currently sits outside settlement (concept section 5.6). Bundled session quotas per plan are the likely answer. This must be an explicit pricing decision, not an emergent one; it needs an operator-level pricing call and stays proposed until then.
