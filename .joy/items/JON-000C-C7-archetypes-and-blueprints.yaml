description: 'Concept sections 5.2 to 5.4: archetypes as product-class knowledge (interaction conventions, class architecture patterns, the question set of things a first-time builder forgets) and blueprints as concrete stack realizations, 1:n per archetype, each carrying what a fast POC needs. Adds the engagement levels ''archetype only'' and ''archetype plus blueprint'', two separate decision items per bootstrap (archetype choice and blueprint choice have different half-lives), the gate rule that the blueprint stack decision is closed by whoever builds, and the Jonsons as internal session personas where no blueprint fits. Includes the open asset placement decision from section 5.6: archetypes shipped with the binary versus blueprints as platform assets. Deliberately left open by operator decision on 2026-07-18.'
