description: 'The PDA interview is a template in jon-core using the same technology as Joy''s AI tool instruction templates: MiniJinja, embedded via include_str!, structured YAML data alongside. The template defines the interview stages for the three documents (vision first: what, for whom, why; then architecture at the chosen level of detail; then contributing), the decision cap rule (a handful of real forks, everything else is prose in ARCHITECTURE.md), and the closing task creation. Scoped to the first engagement level: no archetype, no blueprint questions.'
